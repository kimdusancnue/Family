<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#8fd0f0">
<meta name="description" content="홍천 석화초등학교를 3D 웹으로 걸어 다니는 메타버스. 정문·운동장·본관 교실·복도·엘리베이터·참빛관 체육관.">
<title>홍천 석화초등학교 3D 메타버스</title>
<style>
:root{
  --green:#2f9e62; --green-d:#1f7a4a; --green-l:#8be0a8;
  --sky:#8fd0f0; --ink:#22302a; --ink-soft:#4b6157;
  --panel:rgba(255,255,255,.93); --panel-b:rgba(255,255,255,.72);
  --shadow:0 6px 22px rgba(20,60,45,.18);
  --yellow:#ffc247;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#bfe6f7;
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Nanum Gothic',system-ui,sans-serif;
  color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
canvas{display:block}
#stage{position:fixed;inset:0;touch-action:none;}
.hidden{display:none !important;}

/* ---------- top bar ---------- */
#titleBar{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;display:flex;gap:8px;align-items:center;
  padding:8px 14px 8px 10px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(6px);z-index:20;pointer-events:none;max-width:calc(100vw - 150px);}
#titleBar .logo{font-size:22px;line-height:1}
#titleBar .tt{display:flex;flex-direction:column;line-height:1.15}
#titleBar .tt b{font-size:14px;letter-spacing:-.2px}
#titleBar .tt span{font-size:11px;color:var(--ink-soft)}

/* ---------- warp panel ---------- */
#warpWrap{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:22;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#warpToggle{display:flex;align-items:center;gap:6px;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  color:#fff;background:var(--green);padding:10px 14px;border-radius:14px;box-shadow:var(--shadow);}
#warpToggle:active{transform:scale(.97)}
#warpPanel{width:214px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:10px;backdrop-filter:blur(6px);
  max-height:min(74vh,620px);overflow:auto;}
#warpPanel h4{margin:2px 4px 8px;font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:-.2px}
.warpBtn{display:flex;align-items:center;gap:8px;width:100%;border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  color:var(--ink);background:#f2f7f3;padding:9px 10px;border-radius:11px;margin-bottom:6px;text-align:left;}
.warpBtn:hover{background:#e4f2e8}
.warpBtn:active{transform:scale(.985)}
.warpBtn .ic{font-size:15px}
#mapBox{margin-top:4px;background:#eef6ea;border-radius:12px;padding:6px}
#minimap{width:100%;height:auto;display:block;border-radius:8px}
#mapHint{font-size:10px;color:var(--ink-soft);text-align:center;margin-top:4px}

/* ---------- prompt / toast ---------- */
#prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));z-index:18;
  display:flex;align-items:center;gap:8px;padding:9px 16px;background:rgba(34,48,42,.86);color:#fff;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .18s;}
#prompt.on{opacity:1}
#prompt .key{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
  background:var(--yellow);color:#4a3300;border-radius:6px;font-size:12px;font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(172px + env(safe-area-inset-bottom));z-index:19;
  max-width:min(88vw,560px);padding:12px 18px;background:rgba(255,255,255,.97);border:2px solid var(--green-l);border-radius:16px;
  font-size:14px;line-height:1.5;box-shadow:var(--shadow);opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:var(--green-d)}
#toast .bubbleTail{position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:rgba(255,255,255,.97);
  border-right:2px solid var(--green-l);border-bottom:2px solid var(--green-l);transform:translateX(-50%) rotate(45deg);}

/* ---------- elevator panel ---------- */
#elevPanel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));z-index:21;
  background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px 12px;width:min(300px,86vw);text-align:center;}
#elevPanel .eh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:2px}
#elevDisp{font-family:ui-monospace,Menlo,monospace;font-size:26px;font-weight:800;color:var(--green-d);letter-spacing:1px;margin:2px 0 8px}
#elevDisp small{font-size:11px;color:var(--ink-soft);font-weight:700;margin-left:6px;letter-spacing:0}
.elevRow{display:flex;gap:8px;justify-content:center}
.elevBtn{flex:1;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14px;padding:12px 0;border-radius:13px;
  background:#eaf3ec;color:var(--ink);transition:transform .1s,background .2s}
.elevBtn.cur{background:var(--green);color:#fff}
.elevBtn:active{transform:scale(.96)}
#elevNote{font-size:11px;color:var(--ink-soft);margin-top:9px;line-height:1.4}

/* ---------- joystick + touch buttons ---------- */
#joyZone{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:132px;height:132px;z-index:20;touch-action:none}
#joyBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.42);border:2px solid rgba(255,255,255,.85);
  box-shadow:inset 0 0 22px rgba(47,158,98,.18), 0 4px 14px rgba(20,60,45,.15)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#ffffff,#c9ead7 70%);border:2px solid #ffffff;box-shadow:0 4px 12px rgba(20,60,45,.25)}
#touchBtns{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:10px;align-items:center}
.tbtn{width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;font:inherit;font-size:22px;font-weight:800;color:#fff;
  background:rgba(47,158,98,.92);box-shadow:0 5px 16px rgba(20,60,45,.28);display:flex;align-items:center;justify-content:center;touch-action:none}
.tbtn.sec{width:52px;height:52px;font-size:17px;background:rgba(255,255,255,.92);color:var(--green-d)}
.tbtn:active{transform:scale(.94)}
.tbtn .lbl{font-size:10px;font-weight:800;letter-spacing:-.3px}

/* ---------- hint card ---------- */
#hint{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:17;max-width:330px;background:var(--panel);
  border-radius:14px;padding:11px 14px;box-shadow:var(--shadow);font-size:12px;line-height:1.65;color:var(--ink-soft);
  transition:opacity .5s;}
#hint b{color:var(--ink)}
#hint.gone{opacity:0;pointer-events:none}
#hint .kbd{display:inline-block;padding:1px 5px;border-radius:5px;background:#eef3ef;border:1px solid #d5e2d8;color:#2b3f36;font-size:11px;font-weight:700}

/* ---------- loading / error / fade ---------- */
#loading{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,#c9ecfb,#eaf8e6 55%,#fdf6df);transition:opacity .5s}
#loading.gone{opacity:0;pointer-events:none}
#loading .spin{width:52px;height:52px;border-radius:50%;border:5px solid rgba(47,158,98,.22);border-top-color:var(--green);
  animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading .lt{font-size:15px;font-weight:800}
#loading .ls{font-size:12px;color:var(--ink-soft)}
#err{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;background:#f6f8f7}
#err .card{max-width:420px;background:#fff;border-radius:18px;padding:22px;box-shadow:var(--shadow);text-align:center;font-size:14px;line-height:1.6}
#fade{position:fixed;inset:0;z-index:40;background:#0d1a14;opacity:0;pointer-events:none;transition:opacity .28s}
#fade.on{opacity:1}
#viewBtn{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top));transform:translateY(52px);z-index:22;display:none}

@media (max-width:520px){
  #titleBar{padding:6px 11px 6px 8px;border-radius:14px}
  #titleBar .tt b{font-size:12.5px}
  #titleBar .tt span{font-size:10px}
  #warpPanel{width:196px}
  #hint{display:none}
}
@media (min-width:900px){
  #hint{max-width:360px}
}
</style>
</head>
<body>
<div id="stage"></div>

<div id="titleBar">
  <div class="logo">🏫</div>
  <div class="tt"><b>홍천 석화초등학교</b><span>3D 메타버스 · 걸어서 둘러보기</span></div>
</div>

<div id="warpWrap">
  <div style="display:flex;gap:6px">
    <button id="viewBtn2" class="warpBtn" style="background:var(--panel);box-shadow:var(--shadow);margin:0;width:auto;padding:10px 12px" title="시점 전환">👁 3인칭</button>
    <button id="warpToggle">🧭 바로가기</button>
  </div>
  <div id="warpPanel" class="hidden">
    <h4>빠른 이동</h4>
    <div id="warpList"></div>
    <div id="mapBox"><canvas id="minimap" width="380" height="340"></canvas><div id="mapHint">미니맵 · 내 위치</div></div>
  </div>
</div>

<div id="prompt"><span class="key">E</span><span id="promptTxt">안내</span></div>
<div id="toast"><div class="bubbleTail"></div><div id="toastTxt"></div></div>

<div id="elevPanel" class="hidden">
  <div class="eh">🛗 <span>엘리베이터</span></div>
  <div id="elevDisp">1F<small>탑승 중</small></div>
  <div class="elevRow" id="elevRow"></div>
  <div id="elevNote">버튼을 누르면 문이 닫히고 이동합니다.<br>도착하면 문이 열리고 복도로 나갈 수 있어요.</div>
</div>

<div id="joyZone" class="hidden"><div id="joyBase"></div><div id="joyKnob"></div></div>
<div id="touchBtns" class="hidden">
  <button class="tbtn sec" id="btnView" title="시점">👁</button>
  <button class="tbtn" id="btnJump" title="점프">⤒</button>
  <button class="tbtn" id="btnAct" title="상호작용"><span class="lbl">E</span></button>
</div>

<div id="hint">
  <b>이동</b> <span class="kbd">W A S D</span> / 방향키 &nbsp;·&nbsp; <b>시점</b> 마우스 드래그 &nbsp;·&nbsp; <b>점프</b> <span class="kbd">Space</span><br>
  <b>상호작용</b> <span class="kbd">E</span> &nbsp;·&nbsp; <b>시점 전환</b> <span class="kbd">V</span><br>
  엘리베이터를 타고 2·3층 교실까지 올라가 보세요! 🛗
</div>

<div id="fade"></div>
<div id="loading">
  <div class="spin"></div>
  <div class="lt">석화초 3D 메타버스 준비 중…</div>
  <div class="ls">운동장과 교실을 짓고 있어요 🏫</div>
</div>
<div id="err" class="hidden"><div class="card" id="errCard"></div></div>

<script>
/* 오류 수집 (검증용) */
window.__errors = [];
window.addEventListener('error', function (e) {
  try { window.__errors.push(String((e && (e.message || e.error)) || e)); } catch (x) {}
});
</script>
<script>
function boot(){
  "use strict";
  var T = THREE;

  /* =====================================================================
     0. 기본값 · 도우미
  ===================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var KFONT = '"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';

  var FLOOR_H = 4.0;          // 층고
  var CEIL = 3.4;             // 천장 높이
  var B = { x1: -36, x2: 36, z1: -30, z2: -10 };      // 본관 외곽
  var G = { x1: 42, x2: 62, z1: -34, z2: -6 };        // 참빛관 외곽
  var PITCH = { x1: -26, x2: 26, z1: 4, z2: 40 };     // 축구장
  var TRACK = { x1: -34, x2: 34, z1: -4, z2: 46 };    // 트랙 외곽
  var CAMPUS = { x1: -60, x2: 60, z1: -48, z2: 52 };  // 울타리

  function rnd(seed) { var s = seed || 1; return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }

  function cvs(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  function texFrom(canvas, repX, repY) {
    var t = new T.CanvasTexture(canvas);
    t.colorSpace = T.SRGBColorSpace;
    t.anisotropy = 8;
    if (repX || repY) { t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(repX || 1, repY || 1); }
    return t;
  }

  function rr(g, x1, z1, x2, z2, r) {
    g.beginPath();
    g.moveTo(x1 + r, z1);
    g.lineTo(x2 - r, z1); g.quadraticCurveTo(x2, z1, x2, z1 + r);
    g.lineTo(x2, z2 - r); g.quadraticCurveTo(x2, z2, x2 - r, z2);
    g.lineTo(x1 + r, z2); g.quadraticCurveTo(x1, z2, x1, z2 - r);
    g.lineTo(x1, z1 + r); g.quadraticCurveTo(x1, z1, x1 + r, z1);
    g.closePath();
  }

  function mergeGeoms(list) {
    var pos = [], norm = [], uv = [];
    for (var i = 0; i < list.length; i++) {
      var g = list[i].index ? list[i].toNonIndexed() : list[i];
      var pa = g.attributes.position.array, na = g.attributes.normal.array;
      for (var k = 0; k < pa.length; k++) { pos.push(pa[k]); norm.push(na[k]); }
      if (g.attributes.uv) { var ua = g.attributes.uv.array; for (var j = 0; j < ua.length; j++) uv.push(ua[j]); }
    }
    var out = new T.BufferGeometry();
    out.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    out.setAttribute('normal', new T.Float32BufferAttribute(norm, 3));
    if (uv.length) out.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    return out;
  }
  function bg(w, h, d, x, y, z) { var g = new T.BoxGeometry(w, h, d); g.translate(x, y, z); return g; }

  /* =====================================================================
     1. 렌더러 · 장면 · 조명 · 하늘
  ===================================================================== */
  var LOWQ = /(\?|&)q=low/.test(location.search);
  var renderer = new T.WebGLRenderer({ antialias: !LOWQ, powerPreference: 'high-performance' });
  renderer.setPixelRatio(LOWQ ? 1 : Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = !LOWQ;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  if (T.SRGBColorSpace) renderer.outputColorSpace = T.SRGBColorSpace;
  $('stage').appendChild(renderer.domElement);

  var scene = new T.Scene();
  scene.fog = new T.Fog(0xd8eefb, 150, 340);

  var camera = new T.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 900);

  /* 하늘 (그라데이션 + 구름) */
  (function () {
    var c = cvs(1024, 512), g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0, '#5fb3e8'); grd.addColorStop(0.45, '#a8d9f4');
    grd.addColorStop(0.72, '#e5f4fb'); grd.addColorStop(1, '#f6fbf3');
    g.fillStyle = grd; g.fillRect(0, 0, 1024, 512);
    var R = rnd(7);
    for (var i = 0; i < 26; i++) {
      var x = R() * 1024, y = 60 + R() * 210, s = 26 + R() * 60;
      g.globalAlpha = 0.5 + R() * 0.4; g.fillStyle = '#ffffff';
      g.beginPath();
      g.ellipse(x, y, s * 1.7, s * 0.62, 0, 0, Math.PI * 2);
      g.ellipse(x + s * 0.8, y - s * 0.22, s * 1.05, s * 0.5, 0, 0, Math.PI * 2);
      g.ellipse(x - s * 0.85, y + s * 0.05, s * 0.95, s * 0.45, 0, 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;
    var t = texFrom(c);
    var sky = new T.Mesh(new T.SphereGeometry(520, 32, 20), new T.MeshBasicMaterial({ map: t, side: T.BackSide, fog: false }));
    scene.add(sky);
  })();

  scene.add(new T.HemisphereLight(0xd7ecff, 0x8fbd72, 0.85));
  scene.add(new T.AmbientLight(0xffffff, 0.42));

  var sun = new T.DirectionalLight(0xfff4df, 1.05);
  sun.position.set(58, 96, 62);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 20; sun.shadow.camera.far = 260;
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
  sun.shadow.bias = -0.0009;
  sun.shadow.normalBias = 0.035;
  scene.add(sun);
  scene.add(sun.target);
  sun.target.position.set(0, 0, 8);

  var fill = new T.DirectionalLight(0xbfe0ff, 0.28);
  fill.position.set(-60, 50, -70);
  scene.add(fill);

  /* =====================================================================
     2. 재질
  ===================================================================== */
  function std(color, rough, metal) {
    return new T.MeshStandardMaterial({ color: color, roughness: rough === undefined ? 0.9 : rough, metalness: metal || 0 });
  }
  var MAT = {
    wall: std(0xf7f0e2, 0.95),
    wall2: std(0xefe5d4, 0.95),
    trim: std(0xffffff, 0.8),
    band: std(0x6ec1e4, 0.75),
    band2: std(0x63b8ab, 0.8),
    bandWarm: std(0xffc247, 0.8),
    roof: std(0x8d9aa6, 0.9),
    ceil: new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, emissive: 0xcfcfc8, emissiveIntensity: 0.42 }),
    roofDark: std(0x6c7a86, 0.9),
    concrete: std(0xdedbd2, 0.95),
    brick: std(0xb98a6b, 0.95),
    steel: std(0xb9c6cf, 0.55, 0.35),
    darkSteel: std(0x6f7c86, 0.6, 0.3),
    wood: std(0xc8a06a, 0.9),
    woodLight: std(0xe3c99c, 0.9),
    desk: std(0xe0b978, 0.85),
    desk2: std(0x8fc7d8, 0.8),
    green: std(0x4fa86a, 0.9),
    hedge: std(0x4f9b52, 0.95),
    leaf: std(0x57a45c, 0.95),
    leafDark: std(0x3d7f47, 0.95),
    trunk: std(0x8a6244, 0.95),
    white: std(0xffffff, 0.8),
    red: std(0xd0534a, 0.85),
    door: std(0x9fb7c4, 0.75),
    elevator: std(0xa9b7c1, 0.6, 0.25),
    elevDoor: std(0xc2ced6, 0.5, 0.4),
    elevFloor: std(0x5d6b74, 0.8),
    court: std(0xd9b877, 0.85),
    stage: std(0x8a5a4a, 0.9),
    curtain: std(0x9c3f4b, 0.95),
    soil: std(0x8a6a4e, 1),
    glass: new T.MeshStandardMaterial({ color: 0xbfe6f5, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.32, side: T.DoubleSide }),
    glassDoor: new T.MeshStandardMaterial({ color: 0xcfeefb, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.42, side: T.DoubleSide })
  };

  /* =====================================================================
     3. 지면 텍스처 (운동장·트랙·화단·통행로를 한 장에 그림)
  ===================================================================== */
  function drawCampus() {
    var W = 2048, H = 1792, S = W / 128;      // 16 px / m
    var c = cvs(W, H), g = c.getContext('2d');
    g.setTransform(S, 0, 0, S, 64 * S, 56 * S);   // 월드 좌표(미터)로 그리기: x→오른쪽, z→아래
    var R = rnd(20241115);

    // 잔디 바탕
    g.fillStyle = '#7cbf66'; g.fillRect(-64, -56, 128, 112);
    for (var i = 0; i < 3600; i++) {

    ]);
    var chairGeom = mergeGeoms([
      bg(0.5, 0.06, 0.45, 0, 0.44, 0),

      bg(0.05, 0.44, 0.05, -0.2, 0.22, -0.18),

      bg(0.05, 0.44, 0.05, -0.2, 0.22, 0.18),
      bg(0.05, 0.44, 0.05, 0.2, 0.22, 0.18)
    ]);
    var dm = new T.InstancedMesh(deskGeom, MAT.desk, deskInstances.length);
    var cm = new T.InstancedMesh(chairGeom, MAT.desk2, chairInstances.length);
    var m4 = new T.Matrix4();
    for (var i = 0; i < deskInstances.length; i++) {
      var d = deskInstances[i];

      var ch = chairInstances[i];
      m4.makeTranslation(ch.x, ch.y, ch.z); cm.setMatrixAt(i, m4);
    }
    dm.castShadow = true; dm.receiveShadow = true;
    cm.castShadow = true; cm.receiveShadow = true;
    scene.add(dm); scene.add(cm);
  }

  var ELEV = {

  function makeIndicator() {
    var c = cvs(256, 96), g = c.getContext('2d');
    g.fillStyle = '#0d1a14'; g.fillRect(0, 0, 256, 96);
    var t = new T.CanvasTexture(c);
    t.colorSpace = T.SRGBColorSpace;
    return { c: c, g: g, t: t, last: -99 };
  }
  function drawIndicator(ind, floor, moving, open) {
    var key = floor * 10 + (moving ? 1 : 0) + (open ? 2 : 0);
    if (ind.last === key) return;
    ind.last = key;
    var g = ind.g;
    g.fillStyle = '#0b1712'; g.fillRect(0, 0, 256, 96);
    g.strokeStyle = '#2f6b4d'; g.lineWidth = 4; g.strokeRect(4, 4, 248, 88);
    g.fillStyle = moving ? '#ffd166' : '#8dffb9';
    g.font = '800 60px ' + KFONT; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText((floor + 1) + 'F', 92, 50);
    g.fillStyle = moving ? '#ffb703' : (open ? '#8dffb9' : '#6b8c7c');
    g.font = '700 30px ' + KFONT;
    g.fillText(moving ? '▲▼' : (open ? '열림' : '닫힘'), 190, 52);
    ind.t.needsUpdate = true;
  }

  function buildElevator() {
    var X = 0, Z = -18.65;   // 승강기 중심
    // 샤프트 (모든 층)
    for (var f = 0; f < 3; f++) {
      var y0 = f * FLOOR_H;
      wallX(f, -2.7, 2.7, -21, 0.32, y0, y0 + CEIL, MAT.wall2);
      wallZ(f, -21, -16.4, -2.6, 0.32, y0, y0 + CEIL, MAT.wall2);
      wallZ(f, -21, -16.4, 2.6, 0.32, y0, y0 + CEIL, MAT.wall2);
      // 문틀
      boxMesh(0.5, CEIL, 0.4, MAT.trim, -1.35, y0 + CEIL / 2, -16.45);
      boxMesh(0.5, CEIL, 0.4, MAT.trim, 1.35, y0 + CEIL / 2, -16.45);
      boxMesh(3.2, CEIL - 2.42, 0.4, MAT.wall2, 0, y0 + 2.42 + (CEIL - 2.42) / 2, -16.45);
      boxMesh(0.85, CEIL, 0.4, MAT.wall2, -2.02, y0 + CEIL / 2, -16.45);
      boxMesh(0.85, CEIL, 0.4, MAT.wall2, 2.02, y0 + CEIL / 2, -16.45);
      collider(f, -2.45, -1.1, -16.65, -16.25);
      collider(f, 1.1, 2.45, -16.65, -16.25);
      // 층 표시등
      var ind = makeIndicator();
      var p = new T.Mesh(new T.PlaneGeometry(1.0, 0.38), new THREE.MeshBasicMaterial({ map: ind.t }));
      p.position.set(0, y0 + 2.72, -16.24); scene.add(p);
      ELEV.indicators.push(ind);
      // 호출 버튼
      boxMesh(0.16, 0.62, 0.26, MAT.steel, 2.15, y0 + 1.25, -16.28);
      var btn = new T.Mesh(new T.CircleGeometry(0.06, 12), new T.MeshBasicMaterial({ color: 0xffd166 }));
      btn.position.set(2.24, y0 + 1.25, -16.28); btn.rotation.y = -Math.PI / 2; scene.add(btn);
      // 문짝 (좌/우)
      var dl = boxMesh(1.12, 2.38, 0.09, MAT.elevDoor, -0.56, y0 + 1.21, -16.44);
      var dr = boxMesh(1.12, 2.38, 0.09, MAT.elevDoor, 0.56, y0 + 1.21, -16.44);
      ELEV.doorSets.push({ l: dl, r: dr, y0: y0 });
    }

    // 승강기 카
    var cab = new T.Group();
    function part(w, h, d, mat, x, y, z) {
      var m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = false; m.receiveShadow = true; cab.add(m); return m;
    }
    part(4.2, 0.12, 4.3, MAT.elevFloor, 0, 0.06, 0);
    part(4.2, 0.1, 4.3, MAT.elevDoor, 0, 2.55, 0);
    part(4.2, 2.5, 0.08, MAT.elev, 0, 1.3, -2.1);
    part(0.08, 2.5, 4.2, MAT.elev, -2.06, 1.3, 0);
    part(0.08, 2.5, 4.2, MAT.elev, 2.06, 1.3, 0);
    // 손잡이
    part(3.6, 0.06, 0.06, MAT.steel, 0, 1.05, -2.02);
    part(0.06, 0.06, 3.6, MAT.steel, -1.98, 1.05, 0);
    // 조작반
    part(0.06, 1.0, 0.5, MAT.darkSteel, 1.99, 1.35, -1.5);
    for (var b = 0; b < 3; b++) {
      var bb = new T.Mesh(new T.CircleGeometry(0.055, 12), new T.MeshBasicMaterial({ color: b === 0 ? 0xffd166 : 0xdfe9ee }));
      bb.position.set(1.95, 1.62 - b * 0.3, -1.5); bb.rotation.y = -Math.PI / 2; cab.add(bb);
    }
    // 반사 유리(뒷면)
    var mirror = new T.Mesh(new T.PlaneGeometry(3.8, 2.2), new T.MeshStandardMaterial({ color: 0xdfeef5, metalness: 0.6, roughness: 0.15 }));
    mirror.position.set(0, 1.35, -2.05); cab.add(mirror);
    // 카 천장 조명
    var cl = new T.Mesh(new T.PlaneGeometry(2.4, 2.4), new T.MeshBasicMaterial({ color: 0xfff8e0 }));
    cl.rotation.x = Math.PI / 2; cl.position.y = 2.49; cab.add(cl);
    var cabLight = new T.PointLight(0xfff3d8, 7, 8, 1.5);
    cabLight.position.set(0, 2.3, 0.2);
    cab.add(cabLight);
    cab.position.set(X, 0, Z);
    scene.add(cab);
    ELEV.cab = cab;
    ELEV.x = X; ELEV.z = Z;
  }

  function elevCall(floor) {
    if (ELEV.moving) return;
    if (ELEV.floor === floor) { ELEV.doorsOpen = true; return; }
    ELEV.target = floor; ELEV.moving = true; ELEV.doorsOpen = false;
  }

  function updateElevator(dt) {
    if (ELEV.waitFor > 0) {
      ELEV.waitFor -= dt;
      if (ELEV.waitFor <= 0 && ELEV.pendingTarget !== null) {
        ELEV.target = ELEV.pendingTarget; ELEV.pendingTarget = null; ELEV.moving = true;
      }
    }
    if (ELEV.moving) {
      var ty = ELEV.target * FLOOR_H;
      var d = ty - ELEV.y;
      var step = 2.6 * dt;
      if (Math.abs(d) <= step) {
        ELEV.y = ty; ELEV.floor = ELEV.target; ELEV.moving = false; ELEV.doorsOpen = true;
      } else {
        ELEV.y += Math.sign(d) * step;
      }
    }
    var targetT = ELEV.doorsOpen ? 1 : 0;
    ELEV.doorT += clamp(targetT - ELEV.doorT, -dt * 3.2, dt * 3.2);
    if (ELEV.cab) ELEV.cab.position.y = ELEV.y;
    for (var i = 0; i < ELEV.doorSets.length; i++) {
      var s = ELEV.doorSets[i];
      var t = (ELEV.floor === i) ? ELEV.doorT : 0;
      var off = 0.56 + t * 0.6;
      s.l.position.x = -off; s.r.position.x = off;
      // 문이 층에 맞춰 안 보이게 (다른 층 문은 닫힌 상태 유지)
    }
    for (var k = 0; k < ELEV.indicators.length; k++) {
      drawIndicator(ELEV.indicators[k], ELEV.floor, ELEV.moving, ELEV.doorsOpen && ELEV.doorT > 0.5);
    }
  }

  /* =====================================================================
     12. 플레이어 · 카메라
  ===================================================================== */
  var player = {
    pos: new T.Vector3(0, 0, 47),
    level: 0,
    vy: 0, y: 0,
    inCab: false,
    yawFace: Math.PI,
    speed: 0,
    walkPhase: 0,
    view: 'third'
  };
  var cam = { yaw: 0, pitch: 0.2, dist: 6.6, curDist: 6.6, cur: new T.Vector3() };
  var keys = {};
  var joy = { active: false, x: 0, y: 0, id: null };
  var drag = { on: false, id: null, x: 0, y: 0 };
  var RADIUS = 0.42;

  function groundY() { return player.inCab ? ELEV.y : player.level * FLOOR_H; }

  function resolveCollisions(p, lv) {
    var list = colliders[lv];
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var cx = clamp(p.x, c.x1, c.x2), cz = clamp(p.z, c.z1, c.z2);
      var dx = p.x - cx, dz = p.z - cz;
      var d2 = dx * dx + dz * dz;
      if (d2 > RADIUS * RADIUS) continue;
      if (d2 > 1e-7) {
        var d = Math.sqrt(d2);
        p.x = cx + dx / d * RADIUS;
        p.z = cz + dz / d * RADIUS;
      } else {
        var l = p.x - c.x1, r = c.x2 - p.x, b = p.z - c.z1, f = c.z2 - p.z;
        var m = Math.min(l, r, b, f);
        if (m === l) p.x = c.x1 - RADIUS;
        else if (m === r) p.x = c.x2 + RADIUS;
        else if (m === b) p.z = c.z1 - RADIUS;
        else p.z = c.z2 + RADIUS;
      }
    }
  }

  function updatePlayer(dt) {
    // 입력
    var ix = 0, iz = 0;
    if (keys['w'] || keys['arrowup']) iz -= 1;
    if (keys['s'] || keys['arrowdown']) iz += 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (joy.active) { ix += joy.x; iz += joy.y; }
    var len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; len = 1; }
    var run = keys['shift'] ? 1.7 : 1;
    var maxSpeed = 3.9 * run;

    var fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    var rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    var mx = (fx * (-iz) + rx * ix), mz = (fz * (-iz) + rz * ix);
    var ml = Math.hypot(mx, mz);
    if (ml > 1e-4) { mx /= ml; mz /= ml; }

    var targetSpeed = len > 0.05 ? maxSpeed : 0;
    player.speed = lerp(player.speed, targetSpeed, 1 - Math.pow(0.001, dt));
    if (player.speed < 0.02) player.speed = 0;

    var p = player.pos;
    p.x += mx * player.speed * dt;
    p.z += mz * player.speed * dt;

    // 엘리베이터 처리
    if (!player.inCab) {
      var inShaftX = p.x > -2.15 && p.x < 2.15;
      var openHere = (ELEV.floor === player.level) && ELEV.doorT > 0.45;
      if (inShaftX && p.z < -16.45 && p.z > -21.2) {
        if (openHere && p.z < -17.0) {
          player.inCab = true; showElevPanel(true);
        } else if (!openHere) {
          p.z = -16.45;
        }
      }
      resolveCollisions(p, player.level);
    } else {
      // 카 안에서
      var openNow = ELEV.doorT > 0.5;
      p.x = clamp(p.x, -1.9, 1.9);
      p.z = clamp(p.z, -20.6, openNow ? -15.0 : -16.7);
      player.level = ELEV.floor;
      if (p.z > -16.55 && openNow) {
        player.inCab = false; showElevPanel(false);
        resolveCollisions(p, player.level);
      }
    }

    // 점프
    if ((keys[' '] || keys['space']) && player.y <= 0.001 && !player.inCab) { player.vy = 5.4; }
    if (player.y > 0 || player.vy > 0) {
      player.vy -= 17 * dt;
      player.y += player.vy * dt;
      if (player.y <= 0) { player.y = 0; player.vy = 0; }
    }

    // 아바타 반영
    var gy = groundY();
    avatar.position.set(p.x, gy + player.y, p.z);
    if (player.speed > 0.15) {
      player.walkPhase += dt * player.speed * 2.6;
      var face = Math.atan2(mx, mz);
      player.yawFace = face;
    } else {
      player.yawFace = Math.atan2(fx, fz);
    }
    // 부드러운 회전
    var cur = avatar.rotation.y;
    var diff = ((player.yawFace - cur + Math.PI) % (Math.PI * 2)) - Math.PI;
    avatar.rotation.y = cur + diff * Math.min(1, dt * 12);

    var sw = Math.sin(player.walkPhase) * 0.55 * (player.speed / maxSpeed);
    AV.legL.rotation.x = sw; AV.legR.rotation.x = -sw;
    AV.armL.rotation.x = -sw * 0.85; AV.armR.rotation.x = sw * 0.85;
    AV.body.position.y = Math.abs(Math.sin(player.walkPhase)) * 0.05 * (player.speed > 0.2 ? 1 : 0);
    avatar.visible = (player.view !== 'first');
  }

  function isIndoor(x, z) {
    if (player.level > 0) return true;
    if (x > B.x1 && x < B.x2 && z > B.z1 && z < B.z2) return true;
    if (x > G.x1 - 1 && x < G.x2 + 1 && z > G.z1 && z < G.z2) return true;
    if (x > 35 && x < 43 && z > -25.5 && z < -20.5) return true;
    return false;
  }

  function cameraCollide(target, dir, dist, lv) {
    var ray = new T.Ray(target, dir);
    var maxD = dist;
    var list = occluders[lv];
    var tmp = new T.Vector3();
    for (var i = 0; i < list.length; i++) {
      var hit = ray.intersectBox(list[i], tmp);
      if (hit) {
        var d = target.distanceTo(hit) - 0.28;
        if (d < maxD) maxD = d;
      }
    }
    return Math.max(0.7, maxD);
  }

  function updateCamera(dt) {
    var gy = groundY() + player.y;
    var target = new T.Vector3(player.pos.x, gy + 1.4, player.pos.z);
    cam.pitch = clamp(cam.pitch, -0.35, 1.15);

    if (player.view === 'first') {
      var eye = new T.Vector3(player.pos.x, gy + 1.5, player.pos.z);
      eye.x += Math.sin(cam.yaw) * 0.12; eye.z += Math.cos(cam.yaw) * 0.12;
      camera.position.copy(eye);
      var look = new T.Vector3(
        eye.x - Math.sin(cam.yaw) * Math.cos(cam.pitch),
        eye.y - Math.sin(cam.pitch),
        eye.z - Math.cos(cam.yaw) * Math.cos(cam.pitch)
      );
      camera.lookAt(look);
      cam.curDist = 0;
      return;
    }

    var want = player.inCab ? Math.min(cam.dist, 2.9) : (isIndoor(player.pos.x, player.pos.z) ? Math.min(cam.dist, 3.2) : cam.dist);
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var dir = new T.Vector3(Math.sin(cam.yaw) * cp, sp, Math.cos(cam.yaw) * cp);
    var allow = cameraCollide(target, dir, want, player.level);
    cam.curDist = lerp(cam.curDist, allow, 1 - Math.pow(0.0001, dt));
    var camPos = target.clone().add(dir.multiplyScalar(cam.curDist));
    camPos.y = Math.max(camPos.y, gy + 0.45);
    camera.position.copy(camPos);
    camera.lookAt(target);
  }

  /* =====================================================================
     13. 상호작용
  ===================================================================== */
  var interactables = [];
  function addInteract(lv, x, z, r, label, run) {
    interactables.push({ lv: lv, x: x, z: z, r: r, label: label, run: run });
  }
  var nearest = null;

  function toast(text, ms) {
    var t = $('toast');

  /* =====================================================================
     14. 순간이동 · 페이드

  function fade(on, cb) {
    var f = $('fade');

  }
  function teleport(lv, x, z, yaw, instant) {
    var go = function () {
      player.level = lv;
      player.pos.set(x, 0, z);
      player.y = 0; player.vy = 0; player.speed = 0;
      player.inCab = false;
      showElevPanel(false);
      if (yaw !== undefined && yaw !== null) cam.yaw = yaw;
      cam.curDist = cam.dist;
      updateCamera(0.016);
      cam.curDist = cameraCollide(
        new T.Vector3(x, lv * FLOOR_H + 1.4, z),
        new T.Vector3(Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch)),
        cam.dist, lv);
      updateCamera(0.016);
    };
    if (instant || (lv === player.level && Math.abs(player.pos.x - x) < 0.1 && Math.abs(player.pos.z - z) < 0.1)) { go(); return; }
    fade(true, function () { go(); fade(false); });
  }

  var WARPS = [
    { ic: '🚪', name: '정문', lv: 0, x: 0, z: 47.6, yaw: Math.PI },
    { ic: '⚽', name: '잔디 운동장', lv: 0, x: 0, z: 25, yaw: 0 },
    { ic: '🏫', name: '본관 로비', lv: 0, x: 0, z: -14.2, yaw: 0 },

    { ic: '📚', name: '2층 교실', lv: 1, x: 21.5, z: -17.5, yaw: 0 },
    { ic: '🏀', name: '참빛관(체육관)', lv: 0, x: 52, z: -14.5, yaw: 0 },
    { ic: '🌿', name: '후문', lv: 0, x: 0, z: -43.5, yaw: 0 }

  /* =====================================================================
     15. UI
  ===================================================================== */
  var actPanel = null;
  function showActionPanel(title, opts) {
    if (!actPanel) {
      actPanel = document.createElement('div');
      actPanel.id = 'actPanel';
      actPanel.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom));z-index:21;' +
        'background:rgba(255,255,255,.96);border-radius:18px;box-shadow:0 6px 22px rgba(20,60,45,.18);padding:14px;width:min(280px,84vw);text-align:center';
      document.body.appendChild(actPanel);
    }
    actPanel.innerHTML = '<div style="font-weight:800;font-size:14px;margin-bottom:10px">' + title + '</div>';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.className = 'elevBtn';
      b.style.cssText = 'display:block;width:100%;margin:6px 0';
      b.textContent = o.label;
      b.onclick = function () { actPanel.style.display = 'none'; o.run(); };
      actPanel.appendChild(b);
    });
    var close = document.createElement('div');
    close.style.cssText = 'margin-top:8px;font-size:11px;color:#4b6157;cursor:pointer';
    close.textContent = '닫기';

    actPanel.appendChild(close);
    actPanel.style.display = 'block';

  function showElevPanel(v) {
    var p = $('elevPanel');
    p.classList.toggle('hidden', !v);
    if (v) updateElevPanel(true);
  }
  function buildElevPanel() {
    var row = $('elevRow');
    row.innerHTML = '';
    [2, 1, 0].forEach(function (f) {
      var b = document.createElement('button');
      b.className = 'elevBtn';
      b.dataset.f = f;
      b.textContent = (f + 1) + '층';
      b.onclick = function () {
        if (f === ELEV.floor) { ELEV.doorsOpen = true; return; }
        ELEV.doorsOpen = false; ELEV.pendingTarget = f; ELEV.waitFor = 0.7;
      };
      row.appendChild(b);
    });
  }
  function updateElevPanel(force) {
    if (ELEV.pendingTarget === undefined) ELEV.pendingTarget = null;
    var status = ELEV.moving ? '이동 중…' : (ELEV.doorT > 0.85 ? '문 열림' : (ELEV.doorT > 0.05 ? '문 여닫는 중' : '문 닫힘'));
    var disp = $('elevDisp');
    var txt = (ELEV.floor + 1) + 'F<small>' + status + '</small>';
    if (disp._last !== txt) { disp.innerHTML = txt; disp._last = txt; }
    var btns = $('elevRow').children;
    for (var i = 0; i < btns.length; i++) {
      var f = parseInt(btns[i].dataset.f, 10);
      btns[i].classList.toggle('cur', f === ELEV.floor);
    }
  }

  function updatePrompt() {
    var best = null, bestD = 1e9, label = null;
    if (!player.inCab) {
      for (var i = 0; i < interactables.length; i++) {
        var it = interactables[i];
        if (it.lv !== player.level) continue;
        var d = Math.hypot(player.pos.x - it.x, player.pos.z - it.z);
        if (d < it.r && d < bestD) {
          var lb = typeof it.label === 'function' ? it.label() : it.label;
          if (!lb) continue;
          bestD = d; best = it; label = lb;
        }
      }
    }
    nearest = best;
    var p = $('prompt');
    if (best) {
      if (p._label !== label) { $('promptTxt').textContent = label; p._label = label; }
      p.classList.add('on');
    } else {
      p.classList.remove('on');
    }
    var eb = $('btnAct');
    if (eb) eb.style.background = best ? 'var(--yellow)' : 'rgba(255,255,255,.92)';
    if (eb) eb.style.color = best ? '#4a3300' : 'var(--green-d)';
  }

  /* ---- 미니맵 ---- */
  var mapStatic = null;
  function drawMinimapStatic() {
    var W = 380, H = 340, s = Math.min(W / 128, H / 112);
    var c = cvs(W, H), g = c.getContext('2d');
    g.save(); g.translate(W / 2, H / 2); g.scale(s, s);
    g.fillStyle = '#e9f5dd'; g.fillRect(-64, -56, 128, 112);
    g.fillStyle = '#c4766b'; rr(g, TRACK.x1, TRACK.z1, TRACK.x2, TRACK.z2, 15); g.fill();
    g.fillStyle = '#8ed07c'; rr(g, PITCH.x1, PITCH.z1, PITCH.x2, PITCH.z2, 9); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 0.7;
    g.strokeRect(PITCH.x1, PITCH.z1, PITCH.x2 - PITCH.x1, PITCH.z2 - PITCH.z1);
    g.fillStyle = '#d9d3c6';
    g.fillRect(-30, -10, 60, 6); g.fillRect(-5.2, 44, 10.4, 8);
    g.fillRect(-4.5, -48, 9, 18); g.fillRect(34, -34, 8, 28);
    g.fillStyle = '#f6efe3'; g.strokeStyle = '#bfae94'; g.lineWidth = 0.6;
    g.fillRect(B.x1, B.z1, 72, 20); g.strokeRect(B.x1, B.z1, 72, 20);
    g.fillStyle = '#e9d9bf'; g.fillRect(G.x1, G.z1, 20, 28); g.strokeRect(G.x1, G.z1, 20, 28);
    g.fillStyle = '#ffffff'; g.fillRect(36, -24.5, 6, 3);
    g.fillStyle = '#2f9e62'; g.fillRect(-7.8, 50.6, 15.6, 2.4); g.fillRect(-4.5, -49.4, 9, 2.4);
    g.fillStyle = '#3c6b4f';
    g.beginPath(); g.moveTo(-1, -15.5); g.lineTo(1, -15.5); g.lineTo(0, -13.6); g.fill();
    g.restore();

    // 라벨 (화면 좌표)
    function lab(txt, x, z, color) {
      g.fillStyle = color || '#3c6b4f';
      g.font = '700 11px ' + KFONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(txt, W / 2 + x * s, H / 2 + z * s);
    }
    lab('운 동 장', 0, 24);
    lab('본 관', 0, -20);
    lab('참빛관', 52, -21);
    lab('정문', 0, 49.5);
    lab('후문', 0, -45.5);
    return c;
  }
  function drawMinimap() {
    var el = $('minimap');
    if (!el || !mapStatic) return;
    var g = el.getContext('2d');
    var W = el.width, H = el.height, s = Math.min(W / 128, H / 112);
    g.clearRect(0, 0, W, H);
    g.drawImage(mapStatic, 0, 0);
    // 시야 부채꼴
    var px = W / 2 + player.pos.x * s, pz = H / 2 + player.pos.z * s;
    g.save();
    g.translate(px, pz); g.rotate(-cam.yaw);
    var grd = g.createRadialGradient(0, 0, 2, 0, 0, 46);
    grd.addColorStop(0, 'rgba(47,158,98,.34)'); grd.addColorStop(1, 'rgba(47,158,98,0)');
    g.fillStyle = grd;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 46, -Math.PI / 2 - 0.55, -Math.PI / 2 + 0.55); g.closePath(); g.fill();
    g.fillStyle = '#ffffff'; g.strokeStyle = '#1f7a4a'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, -8); g.lineTo(5.6, 6); g.lineTo(0, 3); g.lineTo(-5.6, 6); g.closePath();
    g.fill(); g.stroke();
    g.restore();
    // 층 표시
    g.fillStyle = 'rgba(34,48,42,.82)';
    g.font = '800 12px ' + KFONT; g.textAlign = 'left'; g.textBaseline = 'top';
    var fl = player.inCab ? '🛗 엘리베이터' : ((player.level + 1) + '층');
    if (!player.inCab && player.level === 0 && player.pos.z > -9.5) fl = '야외';
    g.fillText(fl, 8, 8);
  }

  function buildWarpUI() {
    var list = $('warpList');
    list.innerHTML = '';
    WARPS.forEach(function (w) {
      var b = document.createElement('button');
      b.className = 'warpBtn';
      b.innerHTML = '<span class="ic">' + w.ic + '</span><span>' + w.name + '</span>';
      b.onclick = function () { teleport(w.lv, w.x, w.z, w.yaw); };
      list.appendChild(b);
    });
    $('warpToggle').onclick = function () {
      $('warpPanel').classList.toggle('hidden');
    };
  }

  function setView(v) {
    player.view = v;
    var label = v === 'first' ? '👁 1인칭' : '👁 3인칭';
    $('viewBtn2').textContent = label;
    $('btnView').textContent = v === 'first' ? '🎥' : '👁';
  }
  function toggleView() { setView(player.view === 'third' ? 'first' : 'third'); }

  /* =====================================================================
     16. 입력
  ===================================================================== */
  function setupInput() {
    window.addEventListener('keydown', function (e) {
      var k = e.key.toLowerCase();
      if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
      keys[k] = true;
      if (k === 'shift') keys['shift'] = true;
      if (k === 'e') { if (nearest) nearest.run(); }
      if (k === 'v') toggleView();
      if (k === 'escape') {
        $('warpPanel').classList.add('hidden');
        if (actPanel) actPanel.style.display = 'none';
      }
    });
    window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', function () { keys = {}; });

    var dom = renderer.domElement;
    dom.addEventListener('pointerdown', function (e) {
      if (drag.on) return;
      drag.on = true; drag.id = e.pointerId; drag.x = e.clientX; drag.y = e.clientY;
      try { dom.setPointerCapture(e.pointerId); } catch (x) { }
    });
    dom.addEventListener('pointermove', function (e) {
      if (!drag.on || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      cam.yaw -= dx * 0.0036;
      cam.pitch = clamp(cam.pitch + dy * 0.0030, -0.35, 1.15);
    });
    function endDrag(e) {
      if (e.pointerId === drag.id) { drag.on = false; drag.id = null; }
    }
    dom.addEventListener('pointerup', endDrag);
    dom.addEventListener('pointercancel', endDrag);
    dom.addEventListener('wheel', function (e) {
      e.preventDefault();
      cam.dist = clamp(cam.dist + Math.sign(e.deltaY) * 0.6, 3.2, 13);
    }, { passive: false });

    /* 조이스틱 */
    var zone = $('joyZone'), knob = $('joyKnob');
    var R = 46;
    function setKnob(dx, dy) {
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    }
    zone.addEventListener('pointerdown', function (e) {
      joy.active = true; joy.id = e.pointerId;
      try { zone.setPointerCapture(e.pointerId); } catch (x) { }
      moveJoy(e);
      e.preventDefault();
    });
    zone.addEventListener('pointermove', function (e) {
      if (!joy.active || e.pointerId !== joy.id) return;
      moveJoy(e);
      e.preventDefault();
    });
    function moveJoy(e) {
      var r = zone.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = e.clientX - cx, dy = e.clientY - cy;
      var d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; d = R; }
      setKnob(dx, dy);
      joy.x = dx / R; joy.y = dy / R;
    }
    function endJoy(e) {
      if (e.pointerId === joy.id) { joy.active = false; joy.id = null; joy.x = 0; joy.y = 0; setKnob(0, 0); }
    }
    zone.addEventListener('pointerup', endJoy);
    zone.addEventListener('pointercancel', endJoy);

    $('btnJump').addEventListener('pointerdown', function (e) { e.preventDefault(); if (player.y <= 0.01 && !player.inCab) player.vy = 5.4; });
    $('btnAct').addEventListener('pointerdown', function (e) { e.preventDefault(); if (nearest) nearest.run(); });
    $('btnView').addEventListener('pointerdown', function (e) { e.preventDefault(); toggleView(); });
    $('viewBtn2').addEventListener('click', toggleView);

    window.addEventListener('resize', onResize);
  }
  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  }
  function isTouch() {
    return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia('(hover: none)').matches;
  }

  /* =====================================================================
     17. 루프 · 시작
  ===================================================================== */
  var clock = new T.Clock();
  var frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    updatePlayer(dt);
    updateElevator(dt);
    updateCamera(dt);
    updatePrompt();
    if (frameCount % 3 === 0) drawMinimap();
    if (!$('elevPanel').classList.contains('hidden')) updateElevPanel();
    frameCount++;
    renderer.render(scene, camera);
  }

  function start() {
    buildMain();
    buildDeskInstances();
    buildGate();
    buildFences();
    buildTrees();
    buildFieldStuff();
    buildGym();
    buildWalkway();
    buildElevator();
    buildAvatar();
    setupInteractions();
    buildElevPanel();
    setupInput();
    buildWarpUI();
    mapStatic = drawMinimapStatic();
    setView('third');

    player.pos.set(0, 0, 43.5);
    player.level = 0;
    cam.yaw = 0; cam.pitch = 0.2;
    updateCamera(0.016);

    if (isTouch()) {
      $('joyZone').classList.remove('hidden');
      $('touchBtns').classList.remove('hidden');
    } else {
      setTimeout(function () { $('hint').classList.add('gone'); }, 14000);
    }
    animate();

    setTimeout(function () {
      $('loading').classList.add('gone');
      setTimeout(function () { $('loading').style.display = 'none'; }, 600);
    }, 320);

    // 테스트/디버그용
    window.MV = {
      warp: function (i) { var w = WARPS[i]; teleport(w.lv, w.x, w.z, w.yaw); },
      warpByName: function (n) {
        for (var i = 0; i < WARPS.length; i++) if (WARPS[i].name === n) { this.warp(i); return true; }
        return false;
      },
      tp: function (lv, x, z, yaw, instant) { teleport(lv, x, z, yaw, instant); },
      interact: function () { if (nearest) nearest.run(); },
      view: function (v) { setView(v); },
      state: player, cam: cam, elev: ELEV,
      scene: scene, camera: camera, renderer: renderer,
      prompt: function () { return nearest ? (typeof nearest.label === 'function' ? nearest.label() : nearest.label) : null; },
      toasts: function () { return $('toastTxt').innerHTML; },
      frames: function () { return frameCount; },
      elevGo: function (f) { elevCall(f); },
      version: '1.0'
    };
    window.__ready = true;
  }

  try {
    start();
  } catch (err) {
    window.__errors.push('start: ' + (err && err.stack ? err.stack : err));
    var card = $('errCard');
    if (card) {
      card.innerHTML = '<div style="font-size:34px;margin-bottom:8px">🏫⚠️</div><b>3D 화면을 여는 중 문제가 생겼어요.</b><br>페이지를 새로고침해 주세요.<br><span style="font-size:11px;color:#7a8b81">' + String(err && err.message ? err.message : err) + '</span>';
      $('err').classList.remove('hidden');
      $('loading').style.display = 'none';
    }
    throw err;
  }
}

    var el = document.getElementById('err');
    if (el) {
      document.getElementById('errCard').innerHTML = '<div style="font-size:34px;margin-bottom:8px">📡</div><b>3D 라이브러리를 불러오지 못했어요.</b><br>인터넷 연결을 확인한 뒤 새로고침해 주세요.';
      el.classList.remove('hidden');
    }
  }
  function load(i) {
    if (i >= CDNS.length) { fail(); return; }
    var s = document.createElement('script');
    s.src = CDNS[i];
    s.async = false;
    s.onload = function () { if (window.THREE) { try { boot(); } catch (e) { console.error(e); } } else { load(i + 1); } };
    s.onerror = function () { load(i + 1); };
    document.head.appendChild(s);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { load(0); });
  else load(0);
})();
</script>
</body>
</html>
